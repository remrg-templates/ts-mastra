services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    environment:
      NODE_ENV: production
      APP_TITLE: ${APP_TITLE:-mastra}
      PORT: ${PORT:-4111}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LOCAL_MODEL_URL: ${LOCAL_MODEL_URL}
      LOCAL_STABLEDIFFUSION_URL: ${LOCAL_STABLEDIFFUSION_URL}
    volumes:
      - mastra-data:/app/data
    ports:
      - '127.0.0.1:${PORT:-4111}:${PORT:-4111}'
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:${PORT:-4111}/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 5
    restart: unless-stopped

volumes:
  mastra-data:
